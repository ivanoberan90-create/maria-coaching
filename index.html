<script>
'use strict';
/* ===================== TRENERSKE POSTAVKE =====================
   Ovaj dio mijenja samo trener u izvornom kodu prije objave.

const PLAN={
 version:'2026-11-25-v17-final',

 approvedOn:'2026-11-25',
 dose:{},                /* IZNIMKA doze po vježbi – samo izričitom odlukom trenera i samo za RIR, npr. {hamstring_curl:{rirMin:2,rirMax:3,note:'stabilna tolerancija'}}. Manje od 3 serije se ne prihvaća.

 lowerProgramDefined:true, /* program nogu definirao trener 23.11.2026. (DAYS): prilagođen tendinopatiji stražnje lože; bez leg pressa, čučnja, iskoraka, bugarskog čučnja i RDL-a */

/* ===================== TRENING ===================== */
function tgt(){const i=UI.view;if(i==null||i>=N)return null;
 if(UI.CORR&&UI.CORR.i===i)return{s:UI.CORR.work,i,corr:true};
 if(i===activeIdx()&&!gate())return{s:S.sessions[i],i,corr:false};return null}
function touch(T){if(T.corr)return;const s=T.s;if(s.status==='not_started'){s.status='in_progress';s.startedAt=Date.now();if(!s.rx){s.rx=buildRx(kOf(T.i));s.planVersion=PLAN.version}}s.updatedAt=Date.now()}
function exE(T,k){const rx=rxOf(T.s,T.i),it=rx.find(x=>x.k===k);if(!it||!it.active)return null;return T.s.ex[k]||(T.s.ex[k]={})}
function sttlHTML(i){const s=S.sessions[i],A=shownAct();return `<strong>Tjedan ${wkOf(i)} · Trening ${kOf(i)}</strong><span>${i+1}. od ${N} · ${ST[s.status]}${i===A?' · aktivni':''}</span>`}
function stripHTML(w,i){const A=shownAct();return [0,1,2,3].map(j=>{const ii=(w-1)*CFG.perWeek+j,s=S.sessions[ii],cls=[ii===A?'act':'',isClosed(s)?'cl':''].filter(Boolean).join(' ');
 return `<button type="button" data-act="view" data-i="${ii}" class="${cls}"${ii===i?' aria-current="true"':''} aria-label="Trening ${CFG.keys[j]}, ${ST[s.status]}${ii===A?', aktivni':''}">${CFG.keys[j]}<small>${ii===A&&s.status==='not_started'?'aktivni':STS[s.status]||'&nbsp;'}</small></button>`}).join('')}
function phaseBanner(rx){const up=rx.filter(it=>it.region==='upper'),tr=rx.filter(it=>it.phase==='trener'),pr=up.filter(it=>it.phase==='proba'),reg=up.filter(it=>it.phase!=='trener'&&it.phase!=='proba');
 let t=reg.length&&reg.every(it=>it.sets===3)?'Redovna doza gornjeg dijela: 3 radne serije po vježbi, RIR 2–3, bez rada do otkaza.':'Gornji dio: serije prema verziji plana ovog treninga, bez rada do otkaza.';
 if(tr.length)t+=` Iznimka po izričitoj odluci trenera: ${tr.map(it=>`${esc(it.n)} – ${it.sets} ${it.sets===1?'serija':'serije'}, RIR ${rirRng(it)}${it.doseNote?' ('+esc(it.doseNote)+')':''}`).join('; ')}.`;
 if(pr.length)t+=` Ovaj trening je započet po starijoj verziji plana s kratkom probom: ${pr.map(it=>`${esc(it.n)} (${it.sets} ser.)`).join(', ')}.`;
 return `<p class="bn">${t} Sjedenje, ulazak u spravu i oslonac stopala trebaju biti bez tegoba – ako provociraju kuk, prekini vježbu i označi tegobe.</p>`+lowerNote(rx)}
const PHT_RULES=['Tijekom vježbi za stražnju ložu bol 0–4/10 može biti prihvatljiva ako ne raste tijekom rada.','Bol 5/10 ili više: zaustavi vježbu i provjeri dozu s trenerom.','Važnija je reakcija nakon 24 sata. Porast do 2 boda sljedeći dan sam po sebi ne znači pogoršanje.','Porast 3 ili više boda, pogoršanje koje traje oko 24 h, lošije sjedenje ili lošiji hod = pogoršanje: ne povećavaj dozu, smanji opterećenje, volumen i/ili provokativni opseg i javi treneru.'];
const phtBox=()=>`<details class="gd"><summary>Pravila tolerancije za stražnju ložu</summary><ul class="gl2">${PHT_RULES.map(x=>`<li>${x}</li>`).join('')}</ul><p class="h">To su dogovorena pravila trenera, ne dijagnoza.</p></details>`;
function lowerNote(rx){const lw=(rx||[]).filter(it=>it.region==='lower');if(!lw.length)return '';const old=lw.filter(it=>it.revoked);
 return `<p class="bn">Noge: program prilagođen tegobama stražnje lože. Leg press, čučanj, iskoraci, bugarski čučanj i RDL nisu u programu i ne zamjenjuju se drugim vježbama bez odluke trenera.${old.length?' Stare uvjetne probe ('+old.map(it=>esc(it.n)).join(', ')+') više nisu dio programa; zapisi ostaju.':''}</p>`+(lw.some(it=>it.pht&&it.active)?phtBox():'')}
function restBtns(r){return [...new Set(r)].map(v=>`<button type="button" data-act="rest" data-v="${v}" aria-label="Pokreni odmor ${v} sekundi">${v>=120?v/60+' min':v+' s'}</button>`).join('')}
/* noge: „nema automatskog povećanja” NE znači „ponovi istu dozu” – kod tegoba, prevelikog napora ili odgođenog pogoršanja traži se provjera trenera */
function lowerProbs(it,e,s){const o=[];if(e.sym==='da')o.push('vježba je izazvala tegobe');if(regSym(s,it.k))o.push('u kartici tegoba bol je povezana s ovom vježbom');if(e.rir!=null&&e.rir<it.rirMin)o.push(`RIR ${rirTxt(e.rir)} je ispod cilja ${it.rirMin}–${it.rirMax} (prevelik napor)`);return o}
function lowerMsg(it,e,p,s,st){const fu=fuReact(it.k),fuP=fu&&fu.kind!=='unrelated'?[`nakon nedavnog treninga zabilježeno je odgođeno pogoršanje${fu.kind==='unknown'?' (veza s vježbom nije poznata)':''} – ${fu.txt}`]:[];
 if(st==='done'){const pr=[...lowerProbs(it,e,s),...fuP],miss=[e.sym==null?'odgovor o tegobama':'',e.rir==null?'RIR':''].filter(Boolean);
  if(pr.length)return `<p class="bn w"><b>Nema automatskog povećanja, ali ni ponavljanja iste doze bez provjere:</b> ${esc(pr.join('; '))}. Javi treneru – doza se mora provjeriti i prilagoditi prije sljedeće izvedbe.</p>`;
  if(miss.length)return `<p class="sg">Nedostaje ${miss.join(' i ')} – bez toga trener ne može procijeniti podnošljivost doze. Nema automatskog povećanja.</p>`;
  return `<p class="sg">Bez tegoba i uz ciljani RIR. Nema automatskog povećanja – dozu za sljedeći put određuje trener nakon kontrole idućeg dana.</p>`}
 if(p){const pp=[...lowerProbs(p.it,p.e,p.s),...fuP];return pp.length?`<p class="bn w">Prošli put (${hs(ymdOf(p.s.closedAt))}): ${esc(pp.join('; '))}. Ne ponavljaj istu dozu bez provjere s trenerom.</p>`:`<p class="sg">Prošli put (${hs(ymdOf(p.s.closedAt))}): bez prijavljenih tegoba, RIR ${p.e.rir!=null?rirTxt(p.e.rir):'–'}. Doza je ona koju je odredio trener – nema automatskog povećanja.</p>`}
 return fuP.length?`<p class="bn w">${esc(fuP[0])}. Prije ove probe provjera s trenerom.</p>`:`<p class="sg">Prva proba: vrlo lagano opterećenje, RIR 4–5. Kilažu određuje proba, ne aplikacija.</p>`}
const kgOk=v=>typeof v==='number'&&isFinite(v)&&v>0&&v<=400;   /* i dalje za provjeru starih spremljenih početnih težina (S.startLoad) pri učitavanju i uvozu */
const FIRST_TXT='Napravite 1–2 uvodna seta i postupno odaberite radnu težinu. Cilj je ostati u propisanom rasponu ponavljanja uz urednu tehniku i završiti zadnju radnu seriju približno na RIR 2–3. Uvodni setovi se ne upisuju.';
/* blok „Zadnji put” na kartici vježbe: stvarne serije, završni RIR, sprava; bez preračunavanja i bez prijedloga kilaže */
function prevOccVar(k,i,vk){for(let j=i-1;j>=0;j--){const s=S.sessions[j];if(!isClosed(s))continue;const e=s.ex[k];if(!e||e.omit)continue;const it=(s.rx||[]).find(x=>x.k===k);if(!it||!doneSets(it,e).length||varKey(e)!==vk)continue;return{j,s,e,it}}return null}
/* usporedivo „zadnji put”: za varijantne vježbe samo ista varijacija */
const prevCmp=(it,i,e)=>it.vary?(varKey(e)?prevOccVar(it.k,i,varKey(e)):null):prevOcc(it.k,i);
function lastCard(it,p,title,warn){const ds=doneSets(p.it,p.e),dv=devOf(p.e),iso=p.it.kind==='iso';
 return `<div class="lastp${warn?' wrn':''}"><p class="lab">${title} · ${hd(ymdOf(p.s.closedAt))} <small>(T${wkOf(p.j)}·${kOf(p.j)})</small></p>${warn?`<p class="h"><b>${warn}</b></p>`:''}<ul class="lsets">${Array.from({length:p.it.sets},(_,j)=>{const x=ds.find(q=>q.j===j);return x?`<li>${iso?x.reps+' s':fm(x.kg)+' kg × '+x.reps}</li>`:`<li class="mute">${iso?'držanje':'serija'} ${j+1}: nije izvedena</li>`}).join('')}</ul>
  ${iso?'':`<p>Završni RIR: <b>${p.e.rir!=null?rirTxt(p.e.rir):'nije upisan'}</b></p>`}${p.it.vary||p.e.var?`<p>Varijacija: <b>${varLab(p.e)?esc(varLab(p.e)):'nije upisana'}</b></p>`:''}${iso?'':`<p>Sprava/postavka: ${dv?esc(dv):'<span class="mute">nije upisana</span>'}</p>`}${p.it.pht&&p.e.pain!=null?`<p>Bol tijekom: ${p.e.pain}/10</p>`:''}${isLegacy(p.e)?'<p class="h">Zapis iz starije verzije: jedna kilaža za sve serije.</p>':''}${p.it.sets!==it.sets?`<p class="h">Tada su bile propisane ${p.it.sets} ${p.it.sets===1?'serija':'serije'}, danas ${it.sets} – rezultati nisu izravno usporedivi.</p>`:''}${ds.length<p.it.sets?`<p class="h">Tada je izvedeno ${ds.length} od ${p.it.sets} ${iso?'držanja':'serija'}.</p>`:''}</div>`}
function lastBlock(it,i,e){const p=prevOcc(it.k,i);e=e||{};
 if(!p)return `<div class="lastp first"><p class="lab">Prvi put</p><p>${it.kind==='iso'?'Dvonožna izvedba, 5 držanja po 30–45 s uz 90 s odmora. Kvalitetna kontrakcija, bez forsiranja simptoma. Upiši trajanje svakog držanja.':FIRST_TXT.replace('RIR 2–3','RIR '+rirRng(it))}</p></div>`;
 if(!it.vary)return lastCard(it,p,'Zadnji put');
 const vk=varKey(e);
 if(!vk)return lastCard(it,p,'Zadnji put')+`<p class="h">Odaberi današnju varijaciju: izravna usporedba vrijedi samo uz istu varijaciju i istu spravu/postavku.</p>`;
 if(varKey(p.e)===vk)return lastCard(it,p,'Zadnji put');
